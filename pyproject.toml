[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan"
version = "0.1.0"
description = "Agentic Data Quality & Trust Framework"
authors = [{ name = "Pramaan Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-cloud-bigquery",
    "google-genai",
    "pydantic>=2.0",
    "python-dotenv",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pramaan*"]
